<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback Inbox — Belladonna Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C; --gold-light: #E8C97A; --gold-dim: #8B6B2A;
    --ink: #0E0C0A; --surface: #16130F; --surface2: #1D1912; --surface3: #241F16;
    --border: rgba(201,168,76,0.18); --border-strong: rgba(201,168,76,0.4);
    --text: #E8DFC8; --text-muted: #9E8E6A; --text-dim: #6A5E42;
    --danger: #C0654F; --success: #7DC996; --amber: #D3944F; --blue: #7BA7C7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ink); color: var(--text); font-family: 'Crimson Text', serif; min-height: 100vh; padding: 2rem; }
  h1 { font-family: 'Cinzel', serif; font-size: 1.4rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.3rem; }
  .sub { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 1.75rem; max-width: 720px; line-height: 1.6; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.5rem; align-items: center; }
  .filter-pill {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 99px;
    padding: 0.4rem 1rem; font-family: 'Cinzel', serif; font-size: 0.65rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-muted); cursor: pointer; transition: all 0.2s;
  }
  .filter-pill:hover { border-color: var(--border-strong); }
  .filter-pill.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.08); }
  .count-tag { margin-left: 4px; opacity: 0.7; }
  .spacer { flex: 1; }

  .row {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 1.1rem 1.35rem; margin-bottom: 0.7rem; transition: border-color 0.15s;
  }
  .row.status-new { border-left: 3px solid var(--amber); }
  .row.status-read { border-left: 3px solid var(--blue); }
  .row.status-handled { border-left: 3px solid var(--success); opacity: 0.7; }

  .row-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
  .row-badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge {
    font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 4px; border: 1px solid var(--border);
  }
  .badge-type-question { color: var(--blue); border-color: rgba(123,167,199,0.4); }
  .badge-type-comment { color: var(--text-muted); }
  .badge-type-complaint { color: var(--danger); border-color: rgba(192,101,79,0.4); }
  .badge-type-categoryRequest { color: var(--gold-light); border-color: var(--border-strong); }
  .badge-type-concurrent { color: var(--amber); border-color: rgba(211,148,79,0.4); }
  .venue-tag { font-family: 'Cinzel', serif; font-size: 0.78rem; color: var(--gold-light); }
  .date-tag { font-size: 0.78rem; color: var(--text-dim); }

  .row-body { color: var(--text); line-height: 1.55; margin-bottom: 0.6rem; }
  .row-meta { font-size: 0.82rem; color: var(--text-dim); margin-bottom: 0.7rem; }
  .row-actions { display: flex; gap: 6px; }
  .act-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 0.35rem 0.8rem; border-radius: 5px; cursor: pointer; transition: all 0.2s;
  }
  .act-btn:hover { border-color: var(--border-strong); color: var(--gold); }
  .act-btn.active-state { color: var(--gold); border-color: var(--gold); }

  .empty { color: var(--text-dim); font-style: italic; text-align: center; padding: 3rem 0; }
  .impact-cancel { color: var(--danger); font-weight: 600; }
  .impact-delay { color: var(--amber); font-weight: 600; }
</style>
</head>
<body>

<h1>Feedback Inbox</h1>
<div class="sub">Everything venues submit through the Venue Portal — questions, comments, complaints, category requests, and concurrent event notices — in one place.</div>

<div class="toolbar" id="type-filters"></div>
<div class="toolbar" id="status-filters" style="margin-bottom:1.5rem;"></div>

<div id="rows"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  initializeFirestore, collection, getDocs, doc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIfAE1JGHsUGzzVH2pz1Vyj5b5OhA0tDQ",
  authDomain: "belladonna-hq.firebaseapp.com",
  projectId: "belladonna-hq",
  storageBucket: "belladonna-hq.firebasestorage.app",
  messagingSenderId: "1021873183587",
  appId: "1:1021873183587:web:def283bb7b5ca48e4f9156"
};
const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });

let allItems = []; // unified: { id, source:'venueFeedback'|'concurrentEventNotices', type, venueName, ...,  status, createdAt }
let typeFilter = 'all';
let statusFilter = 'all';

const TYPE_LABELS = {
  question: 'Question', comment: 'Comment', complaint: 'Complaint',
  categoryRequest: 'Category Request', concurrent: 'Concurrent Event'
};

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(ts) {
  if (!ts || !ts.toDate) return '';
  return ts.toDate().toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

async function loadAll() {
  const [fbSnap, ceSnap] = await Promise.all([
    getDocs(collection(db, 'venueFeedback')),
    getDocs(collection(db, 'concurrentEventNotices'))
  ]);

  const fb = fbSnap.docs.map(d => ({ id: d.id, source: 'venueFeedback', ...d.data() }));
  const ce = ceSnap.docs.map(d => ({ id: d.id, source: 'concurrentEventNotices', type: 'concurrent', ...d.data() }));

  allItems = [...fb, ...ce].sort((a, b) => {
    const ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
    const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
    return tb - ta;
  });

  renderFilters();
  renderRows();
}

function renderFilters() {
  const types = ['all', 'question', 'comment', 'complaint', 'categoryRequest', 'concurrent'];
  const typeCounts = {};
  types.forEach(t => typeCounts[t] = t === 'all' ? allItems.length : allItems.filter(i => i.type === t).length);

  document.getElementById('type-filters').innerHTML = types.map(t =>
    `<div class="filter-pill${typeFilter===t?' active':''}" onclick="setTypeFilter('${t}')">${t==='all'?'All Types':esc(TYPE_LABELS[t]||t)}<span class="count-tag">${typeCounts[t]}</span></div>`
  ).join('');

  const statuses = ['all', 'new', 'read', 'handled'];
  const statusCounts = {};
  statuses.forEach(s => statusCounts[s] = s === 'all' ? allItems.length : allItems.filter(i => (i.status||'new') === s).length);

  document.getElementById('status-filters').innerHTML = statuses.map(s =>
    `<div class="filter-pill${statusFilter===s?' active':''}" onclick="setStatusFilter('${s}')">${s==='all'?'All Statuses':s.charAt(0).toUpperCase()+s.slice(1)}<span class="count-tag">${statusCounts[s]}</span></div>`
  ).join('');
}

window.setTypeFilter = function(t) { typeFilter = t; renderFilters(); renderRows(); };
window.setStatusFilter = function(s) { statusFilter = s; renderFilters(); renderRows(); };

function renderRows() {
  const filtered = allItems.filter(i =>
    (typeFilter === 'all' || i.type === typeFilter) &&
    (statusFilter === 'all' || (i.status || 'new') === statusFilter)
  );
  const container = document.getElementById('rows');
  if (!filtered.length) { container.innerHTML = '<div class="empty">Nothing here.</div>'; return; }

  container.innerHTML = filtered.map(item => {
    const status = item.status || 'new';
    const typeBadgeClass = 'badge-type-' + item.type;
    let body = '';
    let meta = '';

    if (item.source === 'concurrentEventNotices') {
      const impactLabel = item.impactType === 'cancel'
        ? '<span class="impact-cancel">Cancels the gig</span>'
        : `<span class="impact-delay">Delayed start${item.newTime ? ' — new time ' + esc(item.newTime) : ''}</span>`;
      body = esc(item.description || '');
      meta = `Event date: ${esc(item.date || '—')} · ${impactLabel}`;
    } else {
      body = esc(item.message || '');
      meta = [item.name, item.email].filter(Boolean).map(esc).join(' · ') || 'No contact info given';
    }

    return `<div class="row status-${status}">
      <div class="row-top">
        <div class="row-badges">
          <span class="badge ${typeBadgeClass}">${esc(TYPE_LABELS[item.type] || item.type)}</span>
          <span class="venue-tag">${esc(item.venueName || 'Unknown Venue')}</span>
        </div>
        <div class="date-tag">${fmtDate(item.createdAt)}</div>
      </div>
      <div class="row-body">${body}</div>
      <div class="row-meta">${meta}</div>
      <div class="row-actions">
        <button class="act-btn${status==='new'?' active-state':''}" onclick="setStatus('${item.source}','${item.id}','new')">New</button>
        <button class="act-btn${status==='read'?' active-state':''}" onclick="setStatus('${item.source}','${item.id}','read')">Read</button>
        <button class="act-btn${status==='handled'?' active-state':''}" onclick="setStatus('${item.source}','${item.id}','handled')">Handled</button>
      </div>
    </div>`;
  }).join('');
}

window.setStatus = async function(source, id, status) {
  try {
    await updateDoc(doc(db, source, id), { status });
    const item = allItems.find(i => i.source === source && i.id === id);
    if (item) item.status = status;
    renderFilters();
    renderRows();
  } catch (e) {
    alert('Could not update status: ' + e.message);
  }
};

loadAll().catch(e => {
  document.getElementById('rows').innerHTML = `<div class="empty">Could not load: ${esc(e.message)}</div>`;
});
</script>
</body>
</html>
